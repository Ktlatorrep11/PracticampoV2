<div class="container-fluid mt-4">
  <div class="row mb-3">
    <div class="col">
      <h2>Solicitudes de Prácticas de Campo</h2>
    </div>
    <div class="col-auto">
      <button mat-raised-button color="primary" (click)="nueva()">
        Nueva Solicitud
      </button>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center mt-5">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="mt-2">Cargando solicitudes...</p>
  </div>

  <mat-card *ngIf="!cargando">
    <table mat-table [dataSource]="solicitudes" class="w-100">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let s">{{ s.id }}</td>
      </ng-container>

      <ng-container matColumnDef="programacion">
        <th mat-header-cell *matHeaderCellDef>Programación</th>
        <td mat-cell *matCellDef="let s">#{{ s.id_programacion_practica }}</td>
      </ng-container>

      <ng-container matColumnDef="consecutivo">
        <th mat-header-cell *matHeaderCellDef>Consecutivo</th>
        <td mat-cell *matCellDef="let s">
          {{ s.consec_dfamarena || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let s">{{ s.fecha_diligenciamiento }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let s">
          <span class="badge-estado">{{ getEstado(s.id_estado) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let s">
          <button mat-icon-button color="primary" title="Ver detalle"
            (click)="verDetalle(s.id)">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['id','programacion','consecutivo','fecha','estado','acciones']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id','programacion','consecutivo','fecha','estado','acciones']"></tr>

    </table>
  </mat-card>
</div>
