<div class="container-fluid mt-4">
  <div class="row mb-3">
    <div class="col">
      <h2>Usuarios del sistema</h2>
    </div>
    <div class="col-auto">
      <button mat-raised-button color="primary" (click)="nuevo()">
        Nuevo usuario
      </button>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center mt-5">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="mt-2">Cargando usuarios...</p>
  </div>

  <mat-card *ngIf="!cargando">
    <table mat-table [dataSource]="usuarios" class="w-100">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let u">{{ getNombre(u) }}</td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let u">{{ u.usuario }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let u">
          <span class="badge-rol">{{ getRol(u.id_role) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let u">
          <span class="badge-estado" [class.inactivo]="u.id_estado === 2">
            {{ u.id_estado === 1 ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="primary" title="Editar"
            (click)="editar(u.id)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['nombre','usuario','email','rol','estado','acciones']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['nombre','usuario','email','rol','estado','acciones']"></tr>

    </table>
  </mat-card>
</div>
