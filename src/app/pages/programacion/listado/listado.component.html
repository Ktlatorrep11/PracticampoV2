<div class="container-fluid mt-4">
  <div class="row mb-3">
    <div class="col">
      <h2>Programaciones de Prácticas de Campo</h2>
    </div>
    <div class="col-auto">
      <button mat-raised-button color="primary" (click)="nueva()">
        Nueva Programación
      </button>
    </div>
  </div>

  <div *ngIf="cargando" class="text-center mt-5">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="mt-2">Cargando programaciones...</p>
  </div>

  <mat-card *ngIf="!cargando">
    <table mat-table [dataSource]="programaciones" class="w-100">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let p">{{ p.id }}</td>
      </ng-container>

      <ng-container matColumnDef="destino">
        <th mat-header-cell *matHeaderCellDef>Destino</th>
        <td mat-cell *matCellDef="let p">{{ p.destino_rp }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha salida</th>
        <td mat-cell *matCellDef="let p">{{ p.fecha_salida_aprox_rp }}</td>
      </ng-container>

      <ng-container matColumnDef="estudiantes">
        <th mat-header-cell *matHeaderCellDef>Estudiantes</th>
        <td mat-cell *matCellDef="let p">{{ p.num_estudiantes_aprox }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p">
          <span class="badge-estado">{{ getEstado(p.id_estado) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="primary" title="Ver detalle" (click)="verDetalle(p.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="accent" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['id','destino','fecha','estudiantes','estado','acciones']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['id','destino','fecha','estudiantes','estado','acciones']"></tr>

    </table>
  </mat-card>
</div>
